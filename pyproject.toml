[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "paraug"
version = "0.7.0"
description = "Parity Augmentation — bit-exact CPU/GPU parity for image augmentation"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.9"
authors = [
    { name = "alieuidsh", email = "alieuidsh@users.noreply.github.com" },
]
keywords = [
    "augmentation",
    "image",
    "computer-vision",
    "deep-learning",
    "pytorch",
    "cpu-gpu-parity",
    "deterministic",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
    "torch>=2.0",
    "numpy>=1.24",
]

[project.optional-dependencies]
opencv = ["opencv-python>=4.5"]
# Pillow enables background_compose.photo_dir (lazy-imported; the rest of
# paraug works without it). Exposed as an opt-in extra:
#   pip install paraug[photo]
photo = ["Pillow>=9.0"]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "Pillow>=9.0",       # so the photo_dir test runs on CI
]

[project.urls]
Homepage = "https://github.com/alieuidsh/paraug"
Repository = "https://github.com/alieuidsh/paraug"
Issues = "https://github.com/alieuidsh/paraug/issues"
Changelog = "https://github.com/alieuidsh/paraug/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/paraug"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
